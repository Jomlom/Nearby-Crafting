modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="Jomlom"
logoFile="assets/nearbycrafting/icon.png"
description='''
Allows the crafting table to access nearby chests or other containers, because that's how it should be!
'''

[[mixins]]
config="nearbycrafting.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.0.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.2,1.21.5)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="recipebookaccess"
    type="required"
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="BOTH"
