plugins {
	id 'net.neoforged.moddev' version '2.0.144'
}

sourceSets {
	main {
		java.srcDir project(':common').file('src/main/java')
		resources.srcDir project(':common').file('src/main/resources')
	}
}

dependencies {
	implementation "com.jomlom.recipebookaccess:recipebookaccess-neoforge:${rootProject.rba_version}"

	implementation("mezz.jei:jei-1.21.10-neoforge:26.3.0.31") {
		transitive = false
	}
}

neoForge {
	version = rootProject.neoforge_version

	parchment {
		minecraftVersion = rootProject.parchment_minecraft_version
		mappingsVersion = rootProject.parchment_version
	}

	mods {
		"nearbycrafting" {
			sourceSet sourceSets.main
		}
	}

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version, "mod_name": rootProject.mod_name, "mod_id": rootProject.mod_id
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
