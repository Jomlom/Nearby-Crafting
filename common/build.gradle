plugins {
	id 'fabric-loom' version '1.14.10'
}

loom {
	splitEnvironmentSourceSets()
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft_version}:${rootProject.parchment_version}@zip")
	}

	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

	modImplementation "com.jomlom.recipebookaccess:recipebookaccess-fabric:${rootProject.rba_version}"

	modCompileOnly("mezz.jei:jei-1.21-fabric:19.8.2.99") {
		transitive = false
	}

	modCompileOnly("maven.modrinth:farmers-delight-refabricated:1.21.1-3.1.2") {
		transitive = false
	}
}

tasks.jar { enabled = false }
tasks.named('sourcesJar') { enabled = false }
