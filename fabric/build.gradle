plugins {
	id 'fabric-loom' version '1.10.5'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"nearbycrafting" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java.srcDir project(':common').file('src/main/java')
		resources.srcDir project(':common').file('src/main/resources')
	}
	client {
		java.srcDir project(':common').file('src/client/java')
		resources.srcDir project(':common').file('src/client/resources')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft_version}:${rootProject.parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

	modImplementation "com.jomlom.recipebookaccess:recipebookaccess-fabric:${rootProject.rba_version}"
	modImplementation "maven.modrinth:modmenu:7.2.2"
	modImplementation "dev.isxander:yet-another-config-lib:3.6.5+1.20.1-fabric"

	modCompileOnly("mezz.jei:jei-1.20.1-fabric:15.20.0.101") {
		transitive = false
	}

	modCompileOnly("maven.modrinth:farmers-delight-refabricated:1.20.1-2.1.4") {
		transitive = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version, "mod_name": rootProject.mod_name
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
